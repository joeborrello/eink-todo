; PlatformIO Project Configuration File
; Dual-hardware e-ink checklist display
; Build environments: waveshare (4.26" SPI) and lilygo_t5 (4.7" touch)

[platformio]
default_envs = waveshare

[env]
; Common settings for both environments
framework = arduino
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit GFX Library@^1.11.9
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
test_build_src = yes

[env:waveshare]
platform = espressif32
board = esp32dev
lib_deps = 
    ${env.lib_deps}
    zinggjm/GxEPD2@^1.5.8
build_flags = 
    ${env.build_flags}
    -DHARDWARE_WAVESHARE
    -DEPD_WIDTH=800
    -DEPD_HEIGHT=480
upload_speed = 921600

[env:lilygo_t5]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
lib_deps = 
    ${env.lib_deps}
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git
    https://github.com/TAMCTec/gt911-arduino.git
build_flags = 
    ${env.build_flags}
    -DHARDWARE_LILYGO_T5
    -DEPD_WIDTH=960
    -DEPD_HEIGHT=540
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
upload_speed = 921600
